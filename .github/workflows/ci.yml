name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  # Debug info is not needed for tests; leaving it out roughly halves compile time and disk use.
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  RUST_VERSION: "1.100" # keep in step with ARG RUST_VERSION in the Dockerfile

jobs:
  # Job id `test` is the name the ruleset will require (as in the other lab repos).
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Vault sync script tests (Python, standard library only)
        run: python3 -m unittest -v
        working-directory: scripts/vault-sync

      - name: Rust toolchain (pinned, same as the Docker build)
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --component clippy
          rustup default "$RUST_VERSION"
          rustc --version
          cargo --version

      - name: Restore the cargo cache
        id: cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-${{ runner.os }}-${{ env.RUST_VERSION }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-${{ env.RUST_VERSION }}-

      - name: Tests
        run: cargo test --workspace --locked

      # Runs even when a test fails, so one red run reports both.
      - name: Clippy
        if: ${{ !cancelled() }}
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      # Save the cache even when a test fails, so a red run does not make the next one cold.
      - name: Save the cargo cache
        if: always() && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-${{ runner.os }}-${{ env.RUST_VERSION }}-${{ hashFiles('Cargo.lock') }}

  # Dependency advisories (RustSec). A separate job, so a new advisory shows up red
  # on the PR without blocking the required `test` check while it is triaged.
  # Third-party actions are pinned by commit; update the SHA and the comment together.
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      # Accepted for now: the SurrealDB advisories are fixed only in
      # major releases, and surrealdb is pinned to =2.7.0 so the Python build can open
      # the same database. Remove these ignores when that pin is lifted.
      #   RUSTSEC-2026-0452 surrealkv 0.9.3, RUSTSEC-2026-0453 surrealdb 2.7.0,
      #   RUSTSEC-2026-0454 surrealdb-core 2.7.0
      - name: cargo audit
        run: >
          cargo audit
          --ignore RUSTSEC-2026-0452
          --ignore RUSTSEC-2026-0453
          --ignore RUSTSEC-2026-0454
