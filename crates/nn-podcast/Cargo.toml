[package]
name = "nn-podcast"
description = "Database-free podcast engine: outline, transcript, speech, audio assembly and the private RSS feed"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
nn-llm.workspace = true

base64.workspace = true
chrono.workspace = true
futures.workspace = true
hex.workspace = true
rand.workspace = true
regex.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
uuid.workspace = true

# Prompt templates (Jinja syntax, same files as the Python original).
minijinja = { version = "2", features = ["json"] }
# ISO 639 code -> English language name (pycountry in the original).
isolang = { version = "2", features = ["english_names"] }

[dev-dependencies]
async-trait.workspace = true
bytes.workspace = true
tempfile.workspace = true
roxmltree = "0.21"
