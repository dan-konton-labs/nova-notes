[package]
name = "nn-ai"
description = "Multi-provider AI clients (chat, embeddings, speech) behind the nn-llm traits"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
nn-llm.workspace = true

tokio.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
futures.workspace = true
async-trait.workspace = true
async-stream.workspace = true
bytes.workspace = true
tracing.workspace = true
base64.workspace = true
hex.workspace = true

# RS256 signing of the Vertex service-account assertion. Already in the
# workspace dependency tree (via SurrealDB), so it costs no extra build.
jsonwebtoken = "9"

[dev-dependencies]
wiremock = "0.6"
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util"] }
