[workspace]
resolver = "2"
members = ["crates/nova-notes", "crates/nn-llm", "crates/nn-ai", "crates/nn-content", "crates/nn-podcast"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

# Shared versions. Where SurrealDB 2.7 already pulls a crate in, we use the same
# major version so it is only compiled once.
[workspace.dependencies]
nn-llm = { path = "crates/nn-llm" }
nn-ai = { path = "crates/nn-ai" }
nn-content = { path = "crates/nn-content" }
nn-podcast = { path = "crates/nn-podcast" }

tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
futures = "0.3"
async-trait = "0.1"
async-stream = "0.3"
bytes = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
regex = "1"
url = "2"
base64 = "0.22"
rand = "0.8"
sha2 = "0.10"
hmac = "0.12"
pbkdf2 = "0.12"
hex = "0.4"
once_cell = "1"
tempfile = "3"
mime_guess = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "multipart", "rustls-tls", "gzip", "brotli", "socks"] }

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

# The embedded SurrealDB engine recurses deeply; unoptimised it can overflow the stack.
[profile.dev.package.surrealdb-core]
opt-level = 1

[profile.release]
opt-level = 3
lto = "thin"
strip = true
